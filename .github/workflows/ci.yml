# CI definition. Runs on GitHub Actions (enabled with the owner's approval on 2026-11-09, when the repository
# went public). The same checks run locally with `make ci`.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          uv sync --extra dense
          uv run python -c "from inkfall import embed; embed.get_model(allow_download=True)"
          cd web && npm ci
      - name: Lint and typecheck
        run: make lint
      - name: Dataset integrity
        run: uv run python scripts/validate_dataset.py
      - name: Tests (ACL/isolation, injection, citations, ingestion, retrieval, API contract)
        run: uv run pytest
      - name: Seed the demo database (the adversarial run copies data/inkfall.db)
        run: uv run python -m inkfall.seed
      - name: Adversarial evaluation
        run: uv run python -m inkfall.adversarial
      - name: Web build
        run: cd web && npm run build
      - name: Licenses
        run: make licenses
