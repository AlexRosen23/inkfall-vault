# Deterministic demo identities. ALL names, organizations and people are fictional.
# These are fixtures for a local demo, not accounts: there are no passwords. See docs/THREAT_MODEL.md
# ("Mock authentication") for what that means and why it would not be acceptable in production.
#
# Access rule (src/inkfall/authz.py), evaluated server-side for every document version:
#   same tenant  AND  classification <= clearance  AND  shares >= 1 ACL group  AND  not behind an ethical wall
# Roles add *functions* (ingest, delete, audit view); they never add read access to document content.

classification_levels: [public, internal, confidential, restricted]

tenants:
  - id: lanternfield
    name: Lanternfield Partners LLP
    kind: Fictional law firm
    collections: [commercial, litigation, firm-policy]
    groups: [lf-all, lf-commercial, lf-litigation, lf-partners]
  - id: corvane
    name: Corvane Freight Holdings
    kind: Fictional logistics and finance group
    collections: [vendor-contracts, finance, incidents]
    groups: [cv-all, cv-procurement, cv-finance, cv-ops]
  - id: pellmoor
    name: Pellmoor Water Authority
    kind: Fictional public water utility
    collections: [policy, operations, board]
    groups: [pm-all, pm-policy, pm-ops, pm-board]

