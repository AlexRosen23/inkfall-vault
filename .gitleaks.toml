# gitleaks: default rules. Add allowlist entries only after confirming by hand that a finding is not a real secret.
[extend]
useDefault = true

# Confirmed by hand 2026-11-08: corpus front-matter document identifiers such as
# `doc_key: CV-AMEND-ORION-01` match generic-api-key. They are fictional document ids, not secrets.
[[allowlists]]
description = "Inkfall corpus doc_key identifiers"
regexTarget = "match"
regexes = ['''doc_key: [A-Z]{2}-[A-Z0-9-]{2,40}''']
